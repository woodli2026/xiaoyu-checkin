<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小雨记 · 宠物 tab 高保真原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --sky:#BFeaff; --sky-deep:#7Fd3ff; --mint:#C8F5DD; --peach:#FFD9C7;
    --sun:#FFE6A0; --star:#FFC93C; --coral:#FF9AA2; --lav:#DDD0FF;
    --ink:#5A5470; --ink-soft:#8C86A3; --card:#FFFFFF; --line:#FFEAF0;
    --ok:#5FD08A; --shadow:0 10px 24px rgba(140,130,170,.18);
    --shadow-sm:0 4px 12px rgba(140,130,170,.14); --r:26px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
    background:
      radial-gradient(120% 80% at 12% 8%, var(--sky) 0%, transparent 55%),
      radial-gradient(120% 80% at 92% 12%, var(--peach) 0%, transparent 50%),
      radial-gradient(140% 100% at 50% 100%, var(--mint) 0%, transparent 60%),
      linear-gradient(160deg,#f3fbff 0%,#fdf3ff 50%,#f3fff7 100%);
    min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 14px;overflow-x:hidden;
  }
  .deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .cloud{position:absolute;font-size:54px;opacity:.55;animation:drift 26s linear infinite;}
  .cloud.c1{top:8%;left:-8%;}.cloud.c2{top:30%;left:80%;font-size:40px;animation-duration:34s;animation-direction:reverse;}
  .cloud.c3{top:64%;left:6%;font-size:46px;animation-duration:30s;}
  .tw{position:absolute;font-size:20px;opacity:.8;animation:tw 3s ease-in-out infinite;}
  .tw.t1{top:14%;left:46%;}.tw.t2{top:48%;left:18%;animation-delay:.6s;}.tw.t3{top:72%;left:74%;animation-delay:1.2s;}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(120vw)}}
  @keyframes tw{0%,100%{transform:scale(.8) rotate(-6deg);opacity:.5}50%{transform:scale(1.15) rotate(6deg);opacity:1}}
  .phone{position:relative;z-index:1;width:390px;height:844px;max-height:92vh;background:#fff;border-radius:46px;
    box-shadow:0 30px 70px rgba(120,110,160,.35), inset 0 0 0 10px #fff, inset 0 0 0 12px #efeaf6;
    overflow:hidden;display:flex;flex-direction:column;}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#efeaf6;border-radius:0 0 16px 16px;z-index:30;}
  .statusbar{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;
    font-family:"Baloo 2";font-weight:700;color:var(--ink);font-size:13px;}
  .statusbar .dots{letter-spacing:2px;}
  .stage{position:relative;flex:1;overflow:hidden;}
  .screen{position:absolute;inset:0;overflow-y:auto;padding:14px 16px 96px;opacity:0;transform:translateY(14px);pointer-events:none;transition:.35s;}
  .screen.active{opacity:1;transform:none;pointer-events:auto;}
  .screen::-webkit-scrollbar{width:0;}

  /* 顶部条：参考首页 kidbar，改为宠物信息条（头像+宠物名称+级别+右侧编辑） */
  .kidbar{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--sky),var(--mint));border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow-sm);position:relative;}
  .kid-ava{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:28px;box-shadow:var(--shadow-sm);flex:0 0 46px;}
  .kid-meta{line-height:1.2;flex:1;min-width:0;}
  .kid-name{font-size:19px;color:#3f5a72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kid-sub{font-size:12px;color:#5e7e96;font-family:"Baloo 2";font-weight:600;}
  .pet-edit{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);font-size:16px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .15s;}
  .pet-edit:active{transform:scale(.88);}

  /* 顶卡：积分余额 + 连续打卡 */
  .topcard{margin-top:14px;background:linear-gradient(135deg,#fff6d8,#ffe9ef);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .topcard .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.6;}
  .topcard .b1{width:80px;height:80px;background:var(--sun);right:-18px;top:-22px;}
  .topcard .b2{width:54px;height:54px;background:var(--coral);left:-16px;bottom:-20px;opacity:.4;}
  .starbig{display:flex;align-items:flex-end;gap:8px;}
  .starbig .num{font-family:"Baloo 2";font-weight:800;font-size:42px;color:var(--star);line-height:1;text-shadow:0 3px 0 #fff,0 6px 10px rgba(255,201,60,.4);}
  .starbig .unit{font-size:18px;color:#c79a2e;margin-bottom:6px;}
  .starbig .spk{font-size:32px;animation:bob 2.4s ease-in-out infinite;transform-origin:bottom;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  .streak{margin-top:10px;display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-family:"Baloo 2";font-weight:700;color:#e8762f;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s;}
  .streak:active{transform:scale(.96);}
  .streak .fl{animation:flick 1.6s ease-in-out infinite;}
  .streak .go{margin-left:2px;opacity:.7;font-size:12px;}
  @keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.2) rotate(-4deg)}}

  /* 宠物舞台 */
  .arena{margin-top:16px;background:linear-gradient(160deg,#eafff4,#e9f3ff);border-radius:var(--r);padding:18px 14px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:center;}
  .arena .deco2{position:absolute;inset:0;pointer-events:none;font-size:18px;opacity:.5;}
  .pet-stage{height:190px;display:grid;place-items:center;position:relative;}
  .pet{font-size:96px;line-height:1;filter:drop-shadow(0 12px 18px rgba(120,110,160,.25));transition:transform .3s;cursor:pointer;}
  .pet.egg{font-size:84px;}
  .pet.s1{animation:wob 2.2s ease-in-out infinite;}
  .pet.s2{font-size:74px;animation:hop 1.4s ease-in-out infinite;}
  .pet.s3{animation:sway 2.6s ease-in-out infinite;}
  .pet.s4{animation:sway 2.6s ease-in-out infinite;}
  .pet.s5{animation:spinGlow 4s linear infinite;}
  .pet-wrap{position:relative;display:inline-grid;place-items:center;}
  .pet-halo{position:absolute;top:-14px;font-size:26px;animation:tw 2.4s ease-in-out infinite;pointer-events:none;}
  .pet-crown{position:absolute;top:-30px;font-size:34px;animation:bob 2s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 0 6px var(--sun));}
  .pet-scarf{position:absolute;bottom:18px;font-size:30px;pointer-events:none;}
  /* 增强配饰（5 阶段精修） */
  .pet-crack{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:40px;height:48px;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.1));}
  .pet-cheek{position:absolute;bottom:26px;width:15px;height:10px;border-radius:50%;background:rgba(255,138,148,.5);pointer-events:none;}
  .pet-cheek.l{left:16%;}.pet-cheek.r{right:16%;}
  .pet-wing{position:absolute;top:26px;font-size:36px;pointer-events:none;filter:drop-shadow(0 0 8px var(--sky));}
  .pet-wing.l{left:-24px;transform:scaleX(-1);animation:flutter 1.8s ease-in-out infinite;}
  .pet-wing.r{right:-24px;animation:flutter 1.8s ease-in-out infinite;}
  @keyframes flutter{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
  .pet-medal{position:absolute;top:-4px;right:-12px;font-size:22px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(255,201,60,.5));animation:tw 2.4s ease-in-out infinite;}
  .pet-shell{position:absolute;top:-20px;font-size:26px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(120,110,160,.2));}
  .pet-banner{margin-top:8px;display:inline-block;background:linear-gradient(135deg,var(--star),var(--coral));color:#fff;font-family:"Baloo 2";font-weight:800;font-size:13px;padding:4px 14px;border-radius:999px;box-shadow:var(--shadow-sm);letter-spacing:1px;}
  @keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
  @keyframes sway{0%,100%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}}
  @keyframes spinGlow{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
  /* 宠物名称+级别已移至顶部宠物信息条 #petBarName/#petBarLevel（参考首页 kidbar） */
  .pet-stage-tag{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 12px;font-family:"Baloo 2";font-weight:700;color:#6a8fae;font-size:13px;margin-top:6px;box-shadow:var(--shadow-sm);}
  /* ===== HUD v2.5：玻璃瓶取代血条/魔法条 =====
     成长=心型玻璃红瓶（按「到下一阶段」的阶段内进度填充），心情=水晶玻璃蓝瓶（按 mood/100）
     布局参考暗黑破坏神：左下成长瓶 / 右下心情瓶 / 中间技能按钮；未领养时两瓶仍常驻（空瓶）
     心形轮廓由参数方程 16sin³t / 13cos t−5cos2t−2cos3t−cos4t 采样 44 点生成（与小程序同一组点） */
  .hud2{margin-top:10px;display:flex;align-items:flex-end;justify-content:space-between;}
  .flask{width:60px;display:flex;flex-direction:column;align-items:center;}
  /* 无瓶盖：成长瓶＝玻璃心，心情瓶＝玻璃钻石（用户 2026-09-19 定稿） */
  .flask .body{position:relative;width:54px;height:58px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.3));box-shadow:0 5px 11px rgba(80,90,130,.22);}
  .flask.heart .body{clip-path:polygon(50.0% 23.8%, 50.1% 22.4%, 51.1% 18.4%, 53.6% 12.9%, 57.9% 7.2%, 64.0% 2.5%, 71.6% 0.0%, 79.8% 0.4%, 87.6% 3.9%, 94.2% 10.1%, 98.5% 18.1%, 100.0% 27.3%, 98.5% 36.7%, 94.2% 45.9%, 87.6% 54.6%, 79.8% 62.9%, 71.6% 70.6%, 64.0% 78.0%, 57.9% 84.9%, 53.6% 91.0%, 51.1% 95.8%, 50.1% 98.9%, 50.0% 100.0%, 49.9% 98.9%, 48.9% 95.8%, 46.4% 91.0%, 42.1% 84.9%, 36.0% 78.0%, 28.4% 70.6%, 20.2% 62.9%, 12.4% 54.6%, 5.8% 45.9%, 1.5% 36.7%, 0.0% 27.3%, 1.5% 18.1%, 5.8% 10.1%, 12.4% 3.9%, 20.2% 0.4%, 28.4% 0.0%, 36.0% 2.5%, 42.1% 7.2%, 46.4% 12.9%, 48.9% 18.4%, 49.9% 22.4%);}
  /* 玻璃钻石：明亮式切割轮廓——台面(30%~70% 顶边) + 冠部 + 腰线(32%) + 亭部收尖 */
  .flask.diamond .body{clip-path:polygon(30% 0%, 70% 0%, 100% 32%, 84% 42%, 50% 100%, 16% 42%, 0% 32%);}
  /* 钻石切面线：腰线 + 台面两侧竖线 + 亭部汇聚到底尖的两条棱 */
  .flask .facet{position:absolute;inset:0;pointer-events:none;z-index:2;background:
    linear-gradient(180deg,transparent 31.2%,rgba(255,255,255,.7) 31.6%,rgba(255,255,255,.7) 32.4%,transparent 32.8%),
    linear-gradient(90deg,transparent 29.6%,rgba(255,255,255,.45) 30%,rgba(255,255,255,.45) 30.6%,transparent 31%),
    linear-gradient(90deg,transparent 69.4%,rgba(255,255,255,.45) 69.8%,rgba(255,255,255,.45) 70.4%,transparent 70.8%);}
  .flask .facet::before,.flask .facet::after{content:"";position:absolute;top:32%;width:84%;height:1px;background:rgba(255,255,255,.5);}
  .flask .facet::before{left:0;transform-origin:0 50%;transform:rotate(53.7deg);}
  .flask .facet::after{right:0;transform-origin:100% 50%;transform:rotate(-53.7deg);}
  .flask .body::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.82),inset 0 -7px 11px rgba(90,100,150,.18);pointer-events:none;}
  .flask .liquid{position:absolute;left:0;right:0;bottom:0;transition:height .6s cubic-bezier(.34,1.4,.5,1);}
  .flask .liquid.growth{background:linear-gradient(180deg,#ffa3b0 0%,#ff5d6c 45%,#e33e58 100%);box-shadow:0 -2px 7px rgba(255,110,130,.55);}
  .flask .liquid.mood{background:linear-gradient(180deg,#95e2ff 0%,#46b6ff 45%,#2f7fe0 100%);box-shadow:0 -2px 7px rgba(70,180,255,.5);}
  .flask .liquid::before{content:"";position:absolute;left:-8%;right:-8%;top:-4px;height:8px;border-radius:50%;background:rgba(255,255,255,.6);animation:wave 2.6s ease-in-out infinite;}
  @keyframes wave{0%,100%{transform:translateY(0) scaleX(1)}50%{transform:translateY(-2px) scaleX(1.08)}}
  .flask .shine{position:absolute;left:10%;top:8%;width:24%;height:72%;border-radius:999px;transform:rotate(8deg);background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.12));pointer-events:none;}
  .flask .bub{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.65);animation:rise 3s ease-in infinite;}
  .flask .bub.b1{left:26%;bottom:10%;animation-delay:.2s;}
  .flask .bub.b2{left:60%;bottom:22%;width:4px;height:4px;animation-delay:1.4s;}
  @keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.85}100%{transform:translateY(-30px);opacity:0}}
  .flask .fnum{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-family:"Baloo 2";font-size:11px;font-weight:800;color:#fff;z-index:3;text-shadow:0 1px 3px rgba(50,40,70,.6),0 0 3px rgba(50,40,70,.35);}
  .flask .flab{margin-top:4px;font-size:11px;font-weight:700;color:#4b5a72;font-family:"Baloo 2";}

  /* 操作区：喂食/抚摸 = 王者荣耀技能魔法按钮 */
  .acts{margin-top:18px;}
  .skills{display:flex;gap:30px;justify-content:center;align-items:flex-end;}
  .skills-empty{width:178px;}   /* 未领养：中间留空，两瓶仍在 */
  .skill{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;cursor:pointer;font-family:inherit;padding:0;}
  .skill .ring{position:relative;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.92);background:radial-gradient(circle at 50% 30%,#ffffff,#dde6f4);display:grid;place-items:center;box-shadow:0 7px 16px rgba(60,70,110,.28),inset 0 -6px 12px rgba(0,0,0,.14);transition:transform .12s;}
  .skill:active .ring{transform:scale(.9);}
  .skill .ic{font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12));}
  .skill .cost{position:absolute;bottom:5px;font-family:"Baloo 2";font-weight:800;font-size:10px;color:#e8762f;}
  .skill .nm{font-family:"Baloo 2";font-weight:700;font-size:13px;color:#5a5460;}
  .skill.disabled{opacity:.5;pointer-events:none;}
  .skill.disabled .ring{filter:grayscale(.55);}
  /* 放生/重置：家长危险操作，弱化为次级按钮 */
  .manage-row{margin-top:14px;display:flex;justify-content:center;}
  .manage-btn{background:none;border:none;color:#b08a9a;font-size:13px;font-family:"Baloo 2";font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .manage-hint{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:10px;}
  .adopt-btn{width:100%;border:none;border-radius:18px;padding:15px;font-family:"ZCOOL KuaiLe";font-size:18px;color:#fff;background:linear-gradient(135deg,var(--coral),var(--sun));box-shadow:var(--shadow);cursor:pointer;}
  /* 互动统计报表（点击连续互动） */
  .sec-title{display:flex;align-items:center;gap:8px;margin:0 2px;font-size:15px;color:var(--ink);font-family:"ZCOOL KuaiLe";}
  .stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
  .st2{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:11px 12px;box-shadow:var(--shadow-sm);}
  .st2 .se{font-size:24px;}
  .st2 .sv{font-family:"Baloo 2";font-weight:800;font-size:18px;color:var(--ink);}
  .st2 .sk{font-size:11px;color:var(--ink-soft);}
  .brow{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .brow .bl{width:40px;flex:0 0 40px;font-size:13px;color:var(--ink-soft);font-family:"Baloo 2";font-weight:700;}
  .brow .btrack{flex:1;height:14px;background:#f0eef7;border-radius:999px;overflow:hidden;}
  .brow .btrack i{display:block;height:100%;border-radius:999px;transition:width .5s;}
  .brow .btrack i.growth{background:linear-gradient(90deg,#ff5d6c,#ff9f43);}
  .brow .btrack i.mood{background:linear-gradient(90deg,#36d1ff,#5b6bff);}
  .brow .bv{width:26px;flex:0 0 26px;text-align:right;font-family:"Baloo 2";font-weight:700;font-size:12px;color:var(--ink);}

  /* 积分记录入口 */
  .entry{margin-top:12px;display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:13px 14px;box-shadow:var(--shadow-sm);cursor:pointer;}
  .entry .ei{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--star),var(--peach));display:grid;place-items:center;font-size:24px;flex:0 0 44px;}
  .entry .et{flex:1;}
  .entry .en{font-size:16px;}
  .entry .es{font-size:12px;color:var(--ink-soft);font-family:"Baloo 2";font-weight:600;margin-top:2px;}
  .entry .ar{color:var(--ink-soft);font-size:20px;}

  .hint{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:16px;line-height:1.6;font-family:"Baloo 2";font-weight:600;}

  /* 成长日记 */
  .diary{margin-top:14px;}
  .diary .dh{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--ink);margin:6px 4px 10px;}
  .diary .row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:11px 13px;box-shadow:var(--shadow-sm);margin-bottom:8px;}
  .diary .de{font-size:22px;width:30px;text-align:center;flex:0 0 30px;}
  .diary .db{flex:1;}
  .diary .dt{font-size:14px;}
  .diary .dd{font-size:11px;color:var(--ink-soft);font-family:"Baloo 2";font-weight:600;margin-top:1px;}

  /* 底部 Tab（5 tab） */
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:74px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;box-shadow:0 -6px 18px rgba(140,130,170,.12);z-index:25;border-radius:26px 26px 0 0;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);cursor:pointer;font-size:11px;font-family:"Baloo 2";font-weight:700;transition:.2s;}
  .tab .te{font-size:24px;transition:.25s;}
  .tab.on{color:var(--coral);}
  .tab.on .te{transform:translateY(-3px) scale(1.12);}

  /* 遮罩 / 弹层 */
  .mask{position:absolute;inset:0;background:rgba(90,84,112,.35);z-index:45;opacity:0;pointer-events:none;transition:.3s;}
  .mask.show{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:28px 28px 0 0;padding:18px 18px 30px;box-shadow:0 -10px 30px rgba(120,110,160,.3);transform:translateY(105%);transition:.35s cubic-bezier(.2,.9,.3,1);max-height:82%;overflow-y:auto;}
  .sheet.show{transform:none;}
  .sheet::-webkit-scrollbar{width:0;}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .sheet-h .sh-t{font-size:19px;}
  .sheet-h .sh-x{font-size:22px;color:var(--ink-soft);cursor:pointer;background:none;border:none;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;font-family:"Baloo 2";font-weight:700;}
  .field input{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 12px;font-family:inherit;font-size:15px;color:var(--ink);background:#fffafd;outline:none;height:88rpx;line-height:88rpx;}
  .field input:focus{border-color:var(--sky-deep);}
  .primary{width:100%;border:none;border-radius:16px;padding:14px;font-family:"ZCOOL KuaiLe";font-size:17px;color:#fff;background:linear-gradient(135deg,var(--coral),var(--sun));box-shadow:var(--shadow);cursor:pointer;margin-top:6px;}
  .ghost{width:100%;border:2px solid var(--line);border-radius:16px;padding:13px;font-family:"ZCOOL KuaiLe";font-size:15px;color:var(--ink-soft);background:#fff;cursor:pointer;margin-top:8px;}
  /* 宠物候选网格 */
  .pet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 4px;}
  .pet-grid button{aspect-ratio:1;border:2px solid var(--line);background:#f6f4fb;border-radius:16px;font-size:34px;cursor:pointer;transition:.15s;}
  .pet-grid button:active{transform:scale(1.1);}
  .pet-grid button.on{background:var(--sun);border-color:var(--coral);box-shadow:var(--shadow-sm);}
  /* 撒花 / toast */
  .confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:70;overflow:hidden;}
  .confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards;}
  @keyframes fall{to{transform:translateY(860px) rotate(540deg);opacity:0;}}
  .toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);background:rgba(90,84,112,.92);color:#fff;padding:12px 20px;border-radius:16px;font-size:15px;z-index:80;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  /* 孵化庆祝大字 */
  .hatch{position:absolute;inset:0;z-index:75;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,rgba(255,255,255,.92),rgba(200,245,221,.92));}
  .hatch.show{display:flex;animation:fade .4s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .hatch .he{font-size:90px;animation:pop .6s ease;}
  .hatch .ht{font-size:28px;color:#3f5a72;margin-top:8px;animation:pop .6s ease .1s both;}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="deco">
  <div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="cloud c3">⛅</div>
  <div class="tw t1">⭐</div><div class="tw t2">✨</div><div class="tw t3">🌟</div>
</div>

<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span class="dots">📶 🔋</span></div>

  <div class="stage">
    <!-- ============ 宠物 tab ============ -->
    <section class="screen active" id="s-pet">
      <!-- 宠物信息条：参考首页 kidbar（头像 + 宠物名称 + 级别 + 右侧编辑） -->
      <div class="kidbar" id="petBar">
        <div class="kid-ava" id="petAva">🥚</div>
        <div class="kid-meta">
          <div class="kid-name" id="petBarName">还没有宠物</div>
          <div class="kid-sub" id="petBarLevel">领养后开启成长</div>
        </div>
        <div class="pet-edit" id="petEdit" onclick="onPetBadge()">✏️</div>
      </div>

      <!-- 顶卡：积分余额 + 连续互动 -->
      <div class="topcard">
        <div class="blob b1"></div><div class="blob b2"></div>
        <div class="starbig">
          <span class="spk">⭐</span>
          <span class="num" id="starNum">28</span>
          <span class="unit">颗星星</span>
        </div>
        <div class="streak" onclick="openStats()"><span class="fl">🔥</span><span id="streakNum">6</span> 天连续互动<span class="go">›</span></div>
      </div>

      <!-- 宠物舞台 -->
      <div class="arena" id="arena">
        <div class="deco2">🌸 🍃 ⭐ 🍃 🌸</div>
        <div id="petView"><!-- JS 渲染 --></div>
      </div>

      <!-- 操作按钮（喂食/抚摸 = 王者荣耀技能按钮） -->
      <div class="acts" id="acts"><!-- JS 渲染 --></div>

      <div class="hint" id="hint"></div>
    </section>

    <!-- 撒花 / toast / 孵化 -->
    <div class="confetti" id="confetti"></div>
    <div class="toast" id="toast"></div>
    <div class="hatch" id="hatch"><div class="he" id="hatchEmoji">🐱</div><div class="ht" id="hatchText">孵化啦！</div></div>

    <!-- 领养弹层 -->
    <div class="mask" id="mask" onclick="closeSheet()"></div>
    <div class="sheet" id="sheet"></div>

    <!-- 底部 Tab（5 tab：宠物为第 4 个） -->
    <div class="tabbar">
      <div class="tab" onclick="toast('首页')"><span class="te">🏠</span>首页</div>
      <div class="tab on" onclick="toast('宠物')"><span class="te">🐾</span>宠物</div>
      <div class="tab" onclick="toast('任务屋')"><span class="te">📋</span>任务屋</div>
      <div class="tab" onclick="toast('动态')"><span class="te">💬</span>动态</div>
      <div class="tab" onclick="toast('我')"><span class="te">⚙️</span>我</div>
    </div>
  </div>
</div>

<script>
/* ---------- 模拟数据（贴合 grill 决策） ---------- */
const SPECIES=[
  {key:'cat',emoji:'🐱',defName:'小猫'},{key:'dog',emoji:'🐶',defName:'小狗'}
];
const FEED_COST=5, GROWTH_PER_FEED=10;
const MOOD_INIT=80, MOOD_PER_FEED=8, MOOD_PER_STROKE=6, MOOD_MAX=100, MOOD_DECAY_PER_MIN=0.05;
const GROWTH_MAX=300; // 传奇伙伴阈值 = 成长总血条框（当前经验进度作为当前血量）
const STAGES=[
  {stage:1,name:'蛋蛋',min:0,max:29,emoji:'🥚',props:[]},
  {stage:2,name:'破壳幼崽',min:30,max:79,emoji:null,props:[]},
  {stage:3,name:'成长体',min:80,max:159,emoji:null,props:['halo']},
  {stage:4,name:'成年体',min:160,max:299,emoji:null,props:['scarf']},
  {stage:5,name:'传奇伙伴',min:300,max:Infinity,emoji:null,props:['crown']}
];
const CRACK_SVG='<svg class="pet-crack" viewBox="0 0 40 48"><path d="M20 2 L15 13 L23 21 L17 29 L22 38 L19 46" fill="none" stroke="#caa46a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const state={
  mode:'parent',            // R10：本地层默认家长模式（宠物页不展示锁）
  stars:28, streak:6,
  // 演示数据：默认带一只宠物（成长 20/30 ⇒ 成长瓶 2/3；心情 80 ⇒ 心情瓶 80%），便于查看液面
  pet:{species:'cat',name:'小灰',growthValue:20,mood:MOOD_INIT,lastMoodAt:Date.now(),lastFedAt:null},
  diary:[],
  stats:{feed:8,stroke:12,feedWeek:5,strokeWeek:7}  // 互动统计（mock）
};
function sp(key){return SPECIES.find(s=>s.key===key)||SPECIES[0];}
function stageInfo(g,key){
  const s=sp(key);
  const st=STAGES.find(x=>g>=x.min&&g<=x.max)||STAGES[STAGES.length-1];
  // v2.5：成长瓶按「到下一阶段」的阶段内进度填充（每次投喂液面可见上升），满级恒满瓶
  const next=st.stage<5?STAGES[st.stage]:null;
  const stageHave=g-st.min;
  const stageNeed=next?next.min-st.min:null;
  const stagePct=next?Math.min(100,Math.max(0,stageHave/stageNeed*100)):100;
  return {stage:st.stage,name:st.name,emoji:st.emoji||s.emoji,props:st.props,feedCount:g/GROWTH_PER_FEED,
          growthValue:g,nextStageAt:next?next.min:null,stageHave,stageNeed,stagePct};
}
/* 玻璃瓶 HUD：pet 为空时也渲染两个空瓶（瓶身常驻），中间为技能按钮 */
function hudHtml(pet,info){
  const gPct=info?Math.round(info.stagePct):0;
  const mPct=pet?Math.round(pet.mood):0;
  const gTxt=info?(info.stageNeed?info.stageHave+'/'+info.stageNeed:'MAX'):'0/'+(STAGES[1].min-STAGES[0].min);
  const mTxt=pet?String(pet.mood):'0';
  const bub=h=>h>0?'<i class="bub b1"></i><i class="bub b2"></i>':'';
  const mid=pet?skillsHtml():'<div class="skills-empty"></div>';
  return `
    <div class="hud2">
      <div class="flask heart">
        <div class="body">
          <div class="liquid growth" style="height:${gPct}%">${bub(gPct)}</div>
          <span class="shine"></span><span class="fnum">${gTxt}</span>
        </div>
        <span class="flab">成长</span>
      </div>
      ${mid}
      <div class="flask diamond">
        <div class="body">
          <div class="liquid mood" style="height:${mPct}%">${bub(mPct)}</div>
          <span class="facet"></span><span class="shine"></span><span class="fnum">${mTxt}</span>
        </div>
        <span class="flab">心情</span>
      </div>
    </div>`;
}
/* 心情：按真实时间衰减 + 边界 */
function applyMoodDecay(pet){
  if(!pet.lastMoodAt) return pet.mood||MOOD_INIT;
  const mins=(Date.now()-pet.lastMoodAt)/60000;
  return Math.max(0,(pet.mood||MOOD_INIT)-mins*MOOD_DECAY_PER_MIN);
}
function clampMood(v){return Math.max(0,Math.min(MOOD_MAX,Math.round(v)));}
function moodFace(m){return m>=80?'😺':m>=50?'🙂':m>=25?'😐':'😿';}

/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1400);}
function confetti(){const c=$('#confetti');const colors=['#FFC93C','#FF9AA2','#7Fd3ff','#C8F5DD','#DDD0FF','#FFD9C7'];
  for(let i=0;i<40;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%6];p.style.animationDelay=Math.random()*.4+'s';c.appendChild(p);setTimeout(()=>p.remove(),1800);}}
/* 家长锁图标已移除：R10 本地层默认家长模式，宠物页不展示锁；放生/重置通过 openManage 让家长确认 */

/* ---------- 渲染宠物舞台 ---------- */
function renderPet(){
  const box=$('#petView');
  if(!state.pet){
    box.innerHTML=`
      <div class="pet-stage"><div class="pet-wrap"><span class="pet egg s1">🥚</span></div></div>
      ${hudHtml(null,null)}`;
    $('#hint').textContent='点击下方「领养」带一只小伙伴回家吧！';
    updatePetBar();
    return;
  }
  state.pet.mood=clampMood(applyMoodDecay(state.pet));
  state.pet.lastMoodAt=Date.now();
  const info=stageInfo(state.pet.growthValue,state.pet.species);
  const emoji=info.emoji;
  let deco='';
  if(info.stage===1){
    const near=state.pet.growthValue>=20;   // 临孵化裂纹
    deco=`<span class="pet egg s1">🥚</span>${near?CRACK_SVG:''}`;
  } else if(info.stage===2){
    deco=`<span class="pet-shell">🥚</span><span class="pet s2">${emoji}</span>`;
  } else if(info.stage===3){
    deco=`<span class="pet-halo">✨</span><span class="pet-cheek l"></span><span class="pet-cheek r"></span><span class="pet s3">${emoji}</span>`;
  } else if(info.stage===4){
    deco=`<span class="pet-medal">🌟</span><span class="pet-scarf">🧣</span><span class="pet s4">${emoji}</span>`;
  } else {
    deco=`<span class="pet-wing l">🪽</span><span class="pet-wing r">🪽</span><span class="pet-crown">👑</span><span class="pet s5">${emoji}</span>`;
  }
  const banner=info.stage===5?'<div class="pet-banner">⭐ 传奇伙伴 ⭐</div>':'';
  box.innerHTML=`
    <div class="pet-stage"><div class="pet-wrap" onclick="petTap()">${deco}</div></div>
    ${banner}
    ${hudHtml(state.pet,info)}`;
  $('#hint').textContent= state.pet
    ? '点「投喂」消耗星星长大，点「抚摸」让它更开心 ✨'
    : '点击下方「领养」带一只小伙伴回家吧！';
  updatePetBar();
}
/* 顶部宠物信息条：头像 + 宠物名称 + 级别（右侧编辑按钮改名） */
function updatePetBar(){
  const ava=$('#petAva'),nm=$('#petBarName'),lv=$('#petBarLevel');
  if(!ava)return;
  if(!state.pet){
    ava.textContent='🥚';nm.textContent='还没有宠物';lv.textContent='领养后开启成长';
    return;
  }
  const info=stageInfo(state.pet.growthValue,state.pet.species);
  ava.textContent=info.emoji;
  nm.textContent=state.pet.name;
  lv.textContent=`${info.name} · Lv.${info.stage}`;
}
function onPetBadge(){
  if(!state.pet){openAdopt();return;}
  openRename();
}
function petTap(){
  if(state.pet && stageInfo(state.pet.growthValue,state.pet.species).stage===5){
    confetti();toast('传奇伙伴向你眨眼 ✨');
  }
}

/* 投喂 / 抚摸技能按钮（放在宠物头像框内） */
function skillsHtml(){
  const canFeed=state.stars>=FEED_COST;
  return `
    <div class="skills">
      <button class="skill ${canFeed?'':'disabled'}" onclick="feed()">
        <span class="ring"><span class="ic">🍼</span><span class="cost">-${FEED_COST}⭐</span></span>
        <span class="nm">投喂</span>
      </button>
      <button class="skill" onclick="stroke()">
        <span class="ring"><span class="ic">✋</span></span>
        <span class="nm">抚摸</span>
      </button>
    </div>`;
}

/* ---------- 操作按钮（框外：领养 / 放生重置） ---------- */
function renderActs(){
  const box=$('#acts');
  if(!state.pet){
    box.innerHTML=`<button class="adopt-btn" onclick="openAdopt()">🥚 领养一只小伙伴</button>`;
    return;
  }
  const parentOnly=state.mode!=='parent';
  box.innerHTML= parentOnly
    ? '<div class="manage-hint">放生 / 重置需家长模式</div>'
    : `<div class="manage-row"><button class="manage-btn" onclick="openManage()">⚙️ 放生 / 重置</button></div>`;
}

/* ---------- 成长日记（点击查看） ---------- */
function openDiary(){
  if(!state.diary.length){openSheet(`<div class="sheet-h"><span class="sh-t">📖 成长日记</span></div><div class="hint" style="margin-top:10px">还没有记录哦，投喂和孵化会留下足迹～</div>`);return;}
  openSheet(`<div class="sheet-h"><span class="sh-t">📖 成长日记</span></div>`+state.diary.slice().reverse().map(d=>`
    <div class="row"><div class="de">${d.icon}</div><div class="db"><div class="dt">${d.text}</div><div class="dd">${d.date}</div></div></div>`).join(''));
}
/* ---------- 互动统计报表（点击连续互动） ---------- */
function openStats(){
  const s=state.stats, gv=state.pet?state.pet.growthValue:0;
  const rows=[
    {em:'🔥',v:state.streak+' 天',k:'连续互动'},
    {em:'🍼',v:s.feed+' 次',k:'累计投喂'},
    {em:'✋',v:s.stroke+' 次',k:'累计抚摸'},
    {em:'🌟',v:'+'+gv,k:'累计成长值'}
  ];
  const max=Math.max(s.feedWeek,s.strokeWeek,1);
  const bar=(lab,val,cls)=>`<div class="brow"><span class="bl">${lab}</span><div class="btrack"><i class="${cls}" style="width:${val/max*100}%"></i></div><span class="bv">${val}</span></div>`;
  openSheet(`
    <div class="sheet-h"><span class="sh-t">📈 互动统计</span></div>
    <div class="stats2">${rows.map(r=>`<div class="st2"><span class="se">${r.em}</span><div><div class="sv">${r.v}</div><div class="sk">${r.k}</div></div></div>`).join('')}</div>
    <div class="sec-title" style="margin:18px 2px 4px">本周互动</div>
    ${bar('投喂',s.feedWeek,'growth')}
    ${bar('抚摸',s.strokeWeek,'mood')}
    <div class="hint" style="margin-top:14px">投喂消耗星星换成长，抚摸免费涨心情；两者都计入连续互动天数。</div>`);
}

/* ---------- 写操作 ---------- */
function feed(){
  if(state.stars<FEED_COST){toast('星星不够啦～');return;}
  const before=state.pet.growthValue;
  state.stars-=FEED_COST;
  state.pet.growthValue=before+GROWTH_PER_FEED;
  state.pet.lastFedAt=Date.now();
  state.stats.feed++;state.stats.feedWeek++;
  state.pet.mood=clampMood(applyMoodDecay(state.pet)+MOOD_PER_FEED);
  state.pet.lastMoodAt=Date.now();
  $('#starNum').textContent=state.stars;
  const hatched=before<30&&state.pet.growthValue>=30;
  renderPet();renderActs();
  if(hatched){showHatch();state.diary.push({icon:'🐣',text:`${state.pet.name} 破壳而出！`,date:new Date().toLocaleString('zh-CN')});}
  else {confetti();toast('投喂成功 +10 成长值 🍼');}
}
function stroke(){
  state.pet.mood=clampMood(applyMoodDecay(state.pet)+MOOD_PER_STROKE);
  state.pet.lastMoodAt=Date.now();
  state.stats.stroke++;state.stats.strokeWeek++;
  renderPet();
  confetti();toast('宠物好开心～ ✨');
}
function showHatch(){
  const info=stageInfo(state.pet.growthValue,state.pet.species);
  $('#hatchEmoji').textContent=info.emoji;
  $('#hatchText').textContent=`${state.pet.name} 孵化啦！`;
  $('#hatch').classList.add('show');
  setTimeout(()=>$('#hatch').classList.remove('show'),1600);
}

/* ---------- 弹层 ---------- */
let adoptPick='cat';
function openSheet(html){$('#sheet').innerHTML=`<div class="sheet-h top"><button class="sh-x" onclick="closeSheet()">×</button></div>`+html;$('#sheet').classList.add('show');$('#mask').classList.add('show');}
function closeSheet(){$('#sheet').classList.remove('show');$('#mask').classList.remove('show');}
function openAdopt(){
  adoptPick='cat';
  openSheet(`
    <div class="sheet-h"><span class="sh-t">🥚 领养一只宠物</span></div>
    <div class="pet-grid">${SPECIES.map(s=>`<button class="${s.key==='cat'?'on':''}" onclick="pickPet('${s.key}',this)">${s.emoji}</button>`).join('')}</div>
    <div class="field" style="margin-top:10px"><label>给它起个名字（≤8字）</label><input id="petName" maxlength="8" placeholder="小猫" value="小猫"/></div>
    <button class="primary" onclick="doAdopt()">带它回家 🏡</button>`);
}
function pickPet(key,el){adoptPick=key;const spc=sp(key);$$('.pet-grid button').forEach(b=>b.classList.remove('on'));el.classList.add('on');$('#petName').value=spc.defName;}
function doAdopt(){
  const name=(($('#petName').value||'').trim())||sp(adoptPick).defName;
  if(name.length>8){toast('名字最多 8 个字');return;}
  state.pet={species:adoptPick,name,growthValue:0,mood:MOOD_INIT,lastMoodAt:Date.now(),lastFedAt:null};
  state.diary.push({icon:'🏡',text:`领养了 ${name}`,date:new Date().toLocaleString('zh-CN')});
  closeSheet();confetti();toast(`欢迎 ${name}！🎉`);renderPet();renderActs();
}
function openRename(){
  openSheet(`
    <div class="sheet-h"><span class="sh-t">✏️ 修改宠物名称</span></div>
    <div class="field" style="margin-top:10px"><label>名字（≤8字）</label><input id="renameInput" maxlength="8" value="${state.pet.name}" placeholder="${state.pet.name}"/></div>
    <button class="primary" onclick="doRename()">保存</button>`);
}
function doRename(){
  const v=(($('#renameInput').value||'').trim());
  if(!v){toast('名字不能为空');return;}
  if(v.length>8){toast('名字最多 8 个字');return;}
  const old=state.pet.name;state.pet.name=v;
  state.diary.push({icon:'✏️',text:`${old} 改名为 ${v}`,date:new Date().toLocaleString('zh-CN')});
  closeSheet();toast('改名成功 ✏️');renderPet();renderActs();
}
function openManage(){
  if(state.mode!=='parent'){toast('放生/重置需家长模式');return;}
  openSheet(`
    <div class="sheet-h"><span class="sh-t">⚙️ 宠物管理</span></div>
    <div class="hint" style="margin-top:0">放生会删除宠物（成长清零，可重新领养）；重置保留宠物回到蛋蛋。</div>
    <button class="primary" style="background:linear-gradient(135deg,var(--lav),var(--peach))" onclick="doReset()">重置成长（回到蛋蛋）</button>
    <button class="ghost" onclick="doRelease()">放生宠物</button>`);
}
function doReset(){
  state.pet.growthValue=0;state.pet.lastFedAt=null;state.pet.mood=MOOD_INIT;state.pet.lastMoodAt=Date.now();
  state.diary.push({icon:'🥚',text:`${state.pet.name} 被重置回蛋蛋`,date:new Date().toLocaleString('zh-CN')});
  closeSheet();toast('已重置 ✅');renderPet();
}
function doRelease(){
  state.diary.push({icon:'👋',text:`和 ${state.pet.name} 说再见`,date:new Date().toLocaleString('zh-CN')});
